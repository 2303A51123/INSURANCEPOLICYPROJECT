apiVersion: v1
kind: Service
metadata:
  name: insurance-service
  namespace: insurance-system
  labels:
    app: insurance-app
spec:
  type: NodePort
  selector:
    app: insurance-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: insurance-internal-service
  namespace: insurance-system
  labels:
    app: insurance-app
spec:
  type: ClusterIP
  selector:
    app: insurance-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
